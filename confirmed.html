<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — Daily Denim</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0B1F3B;
    color: #fff;
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    padding: 32px 24px;
    box-sizing: border-box;
  }
  .card { max-width: 420px; width: 100%; text-align: center; }
  .wordmark { font-size: 18px; letter-spacing: -0.2px; margin-bottom: 10px; }
  .stripes { display: inline-flex; flex-direction: column; gap: 5px; margin-bottom: 44px; }
  .stripes i { display: block; width: 44px; height: 7px; }
  .ecru { background: #EDE3CC; }
  .red { background: #C2452D; }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; font-weight: 600; letter-spacing: 1.6px;
    color: #C9A77A; text-transform: uppercase; margin-bottom: 12px;
  }
  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.4px; margin: 0 0 16px; font-weight: 400; }
  p { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.55); margin: 0 0 12px; font-style: italic; }
  .rule { height: 1px; background: rgba(201,167,122,0.28); margin: 32px 0 20px; }
  .foot {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; letter-spacing: 1.4px; color: rgba(255,255,255,0.35);
    text-transform: uppercase; font-style: normal;
  }
  a { color: #C9A77A; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Daily Denim</div>
    <div class="stripes"><i class="ecru"></i><i class="red"></i></div>

    <div class="eyebrow">Email confirmed</div>
    <h1>You're on the record.</h1>
    <p>Your email address is verified. Open Daily Denim on your phone and sign in — your closet is waiting.</p>

    <div class="rule"></div>
    <div class="foot">You can close this page</div>
  </div>
</body>
</html>
